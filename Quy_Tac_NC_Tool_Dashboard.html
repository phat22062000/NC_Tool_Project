<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quy Tắc NC Tool - Dashboard</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1a2233;--mut:#5d6b82;--line:#dde2ea;--acc:#1d5fd1;--accbg:#e6f0fd;--ok:#16803c;--okbg:#e6f4ea;--warn:#a05a00;--warnbg:#fdf0da;--err:#b42318;--errbg:#fdeceb;--code:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e7eaf0;--mut:#9aa6ba;--line:#2e3644;--acc:#6aa3ff;--accbg:#1b2c48;--ok:#4ade80;--okbg:#17321f;--warn:#f5b44a;--warnbg:#3a2a10;--err:#f87171;--errbg:#3b1b1b;--code:#232a36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:600}
header .upd{color:var(--mut);font-size:13px}
header input{margin-left:auto;min-width:240px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;max-width:1280px;margin:0 auto;padding:22px 24px 60px}
nav{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 96px);overflow:auto}
nav a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
nav a:hover,nav a.on{background:var(--accbg);color:var(--acc)}
nav a b{width:24px;height:24px;border-radius:7px;background:var(--accbg);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.kpi small{display:block;color:var(--mut);font-size:12.5px}.kpi b{font-size:26px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 18px;font-size:17px;font-weight:600}
.card>summary::-webkit-details-marker{display:none}
.card>summary .num{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.card>summary .chev{margin-left:auto;color:var(--mut);transition:transform .15s}
.card[open]>summary .chev{transform:rotate(90deg)}
.body{padding:2px 18px 18px;border-top:1px solid var(--line)}
.body h3{font-size:15px;margin:18px 0 6px;color:var(--acc)}
.body p{margin:10px 0}
.body ol,.body ul{margin:8px 0;padding-left:22px}.body li{margin:5px 0}
.body li>ul,.body li>ol{margin:4px 0}
code{background:var(--code);padding:1px 6px;border-radius:5px;font:13px Consolas,monospace}
.tw{overflow:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--code);text-align:left;font-weight:600;white-space:nowrap}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accbg)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:600}
.chip.acc{background:var(--accbg);color:var(--acc)}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.err{background:var(--errbg);color:var(--err)}
.steps{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:12px 0}
.step{display:flex;gap:8px;align-items:center;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.step.arrow{background:none;border:0;padding:0;color:var(--mut);align-self:center}
.lookup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.lookup h2{font-size:17px;margin:0 0 10px}
.lookup .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.lookup label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:4px}
.lookup select,.lookup input{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:150px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.res div{background:var(--code);border-radius:10px;padding:10px 14px}.res small{display:block;color:var(--mut);font-size:12.5px}.res b{font-size:20px;font-weight:600}
.note{margin-top:10px;font-size:13.5px;color:var(--warn)}
mark{background:#ffe27a;color:#000;border-radius:3px}
.hide{display:none!important}
@media(max-width:860px){.wrap{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header><h1 id="ttl">Quy tắc NC Tool</h1><span class="upd" id="upd"></span><input id="q" type="search" placeholder="Tìm quy tắc (ví dụ: joint, piercing, SUS…)"></header>
<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <div class="kpis" id="kpis"></div>
    <section class="lookup" id="lookup" hidden>
      <h2>Tra cứu thông số theo vật liệu và độ dày</h2>
      <div class="row">
        <label>Nhóm vật liệu<select id="lg"></select></label>
        <label>Độ dày (mm)<input id="lt" type="number" step="0.1" min="0.1" value="3.2"></label>
      </div>
      <div class="res" id="lres"></div><div class="note" id="lnote"></div>
    </section>
    <div id="cards"></div>
  </main>
</div>
<script>
const MD = "# Quy tắc của DXF To NC Conversion Tool\n\nCập nhật lần cuối: 14-11-2026. File này được cập nhật mỗi khi có quy tắc mới.\n\n## 1. Đầu vào DXF: đọc và phân loại\n\n| Đối tượng (Layer 0) | Màu | Ý nghĩa | Mã NC |\n|---|---|---|---|\n| LINE, ARC, CIRCLE, LWPOLYLINE | by layer (hoặc trắng) | Biên dạng ngoài, lỗ | `M98P9010` |\n| POINT | by layer | Lỗ trắng (không xuyên) | `M98P9016` |\n| LINE, ARC (đường hở) | xanh lá (ACI 3) | Khe cắt | `M98P9010` |\n| POINT | xanh lá | Piercing xuyên (đục một điểm) | `M98P9010` |\n| LINE, ARC, CIRCLE | đỏ (ACI 1) | Kẻ dấu (kegaki) | `M98P9017` |\n| Đường nét đứt (DASHED) | bất kỳ | Đường uốn, bỏ qua | không cắt |\n| Màu khác | ngoài các màu trên | Bỏ qua, có cảnh báo | không cắt |\n\n1. LWPOLYLINE (kể cả cung bulge) được đổi thành LINE và ARC. Khối INSERT được bung thành đối tượng thường.\n2. POLYLINE (cũ) và ELLIPSE: báo lỗi, cần Explode trước. INSERT tỉ lệ không đều hoặc đối xứng: báo lỗi.\n3. Các đầu mút cách nhau không quá 0.02 mm được nối thành một điểm, **chỉ giữa các đối tượng cùng màu** (từ 04-11-2026). Kegaki (đỏ) không bị nối vào biên ngoài. Ca 26-065663: đoạn kegaki kết thúc cách đỉnh biên ngoài 0.01 mm (y = 12.49) là cố ý, nên đầu đó không chạm biên, không dùng làm điểm đục, và đường cắt dừng đúng tại y = 12.49. Mỗi điểm nối tối đa 2 đầu mút: nếu gộp sẽ tạo nút có 3 đầu mút thì không gộp. Nhờ vậy khe hở joint 0.005 mm của đường dẫn vào đã vẽ sẵn (mục 6.3) không bị lấp kín.\n4. Đường hở màu by layer (biên ngoài hoặc lỗ không khép kín): báo lỗi kèm tọa độ chỗ hở. Đường hở chỉ hợp lệ với màu xanh lá (khe cắt) và đỏ (kẻ dấu).\n5. Biên dạng ngoài là vòng kín lớn nhất. Nếu một CIRCLE by layer lớn hơn mọi vòng kín thì đó là phôi tròn.\n6. Vòng kín xanh lá được xử lý như lỗ.\n7. **SPLINE** (từ 24-10-2026): chuyển thành các đoạn thẳng `G01`, xử lý như LINE cùng màu và cùng layer (biên ngoài, lỗ, khe cắt, kegaki). Cách chia, khớp với `ViDu_Spline.nc`:\n   - Đọc B-spline từ bậc, knot, điểm điều khiển (có trọng số thì tính như NURBS). Lấy tham số từ đầu đến cuối.\n   - Chia đôi tham số theo đệ quy. Đoạn `[a, b]` được chia đôi khi độ võng lớn nhất so với dây cung `> 0.01 mm`. Độ võng đo tại 3 điểm ở 1/4, 1/2 và 3/4 tham số của đoạn.\n   - Các đoạn thẳng nối tiếp tạo thành biên dạng cùng các LINE và ARC kề bên. Đầu mút lệch dưới 0.02 mm được nối như mục 3.\n   - Spline chỉ có điểm fit, không có điểm điều khiển: nối thẳng các điểm fit. Spline nét đứt thì bỏ qua như đường uốn.\n   - Có cảnh báo cho biết số spline và số đoạn thẳng đã tạo.\n8. **Hệ tọa độ đối tượng (từ 28-10-2026):** CIRCLE, ARC, LWPOLYLINE và POINT có vector pháp tuyến (nhóm 210/220/230) khác (0, 0, 1) được đổi sang tọa độ thế giới theo thuật toán trục tùy ý của AutoCAD. Trường hợp thường gặp là vẽ trong UCS bị lật gương (230 = −1): hoành độ đổi dấu, cung đổi chiều. Ca 26-061922 có hai CIRCLE tại x = −321.8 và −171.8, thực tế nằm tại x = 321.8 và 171.8 trong phôi.\n9. **Đoạn thẳng ngắn hơn dung sai nối (từ 28-10-2026):** khi nối đầu mút (mục 3), hai đầu của cùng một đoạn không bao giờ được gộp (và đầu mút khác màu không được gộp với nhau) vào cùng một điểm. Đoạn ngắn hơn 0.02 mm (ví dụ 0.008 mm ở góc khía) được giữ nguyên và xuất thành một dòng `G01` riêng, cung đi vào hoặc đi ra đoạn đó giữ nguyên điểm đầu cuối thật của mình. Các cặp đầu mút được gộp từ gần đến xa. Nếu gộp, đoạn thành chiều dài 0, nút có bậc 4 và tool báo biên dạng hở hoặc rẽ nhánh (ca 26-063561). Đoạn có đầu và cuối trùng nhau trong DXF gốc vẫn bị bỏ.\n\n## 2. Vật liệu, độ dày và thông số\n\n| Nhóm | Độ dày (mm) | Piercing ngoài | Joint ngoài | Piercing lỗ | Joint lỗ |\n|---|---|---|---|---|---|\n| SS | ≤ 3.2 | 3 | 0.8 | 6 | 0 |\n| SS | 3.2 đến 9 | 6 | 1 | 6 | 0 |\n| SS | 9 đến 16, và trên 16 dưới 19 | 10 | 1 | 10 | 0 |\n| SS | ≥ 19 | cong (mục 6) | 3 | 10 | 0 |\n| SUS | ≤ 8 | 6 | 0.7 | 6 | 0.7 |\n| SUS | 8 đến 16, và trên 16 dưới 19 | 10 | 1 | 10 | 1 |\n| SUS | ≥ 19 | cong (mục 6) | 3 | 10 | 1 |\n| AL | ≤ 8 | 6 | 0.7 | 6 | 0.7 |\n| AL | 8 đến 18 | 10 | 1 | 10 | 1 |\n| AL | ≥ 19 | cong (mục 6) | 0.01 | 10 | 0 |\n| CU | mọi độ dày | 6 | 0.7 | 6 | 0.7 |\n\n1. Thông số lấy từ file Excel theo mã DXF (tên file). Tên vật liệu tự nhận nhóm: SS (SS400, SPHC, SPCC, SPHCP…), SUS (SUS, inox, 2B, HL, 304…), AL (A5052, **A1050, ＡＬその他**, nhôm…), CU (đồng và đồng thau: 銅, 黄銅, **真鍮**, シンチュウ, BRASS, COPPER, C1100, C2801, C2600, C2680, C3604). Đồng thau dùng đúng thông số của CU trong bảng trên (piercing ngoài 6, joint ngoài 0.7, piercing lỗ 6, joint lỗ 0.7, mọi độ dày). Trên giao diện, mục \"CU – Đồng / Đồng thau\" áp dụng cho cả hai. Chữ toàn góc (ＡＬ, ＳＵＳ…) được đổi sang chữ thường trước khi nhận dạng. Chữ `その他` đứng một mình không nhận dạng được.\n2. Mã không có trong Excel dùng vật liệu và độ dày ở hai ô nhập tay, ghi \"Nhập Tay\". Mỗi file có thông số riêng. Đổi hai ô chỉ áp dụng cho file đang chọn.\n3. Độ dày không hợp lệ hoặc nhóm không hợp lệ: báo lỗi.\n4. \"Joint lỗ 0\" của SS nghĩa là đường cắt khép kín nhưng vẫn áp dụng quy tắc vị trí joint (mục 5).\n5. **Khách hàng đặc biệt (từ 14-11-2026):** tool đọc cột khách hàng của file Excel (tiêu đề `得意先`, `客先`, `顧客`, `Khách hàng` hoặc `Customer`; ở mẫu CAD依頼書 cột G là mã số, cột H là tên). Mỗi khách có thể có quy tắc riêng, áp dụng cho mọi vật liệu và độ dày:\n   - **Khách 824 (武野工業): không tạo joint cho lỗ bên trong**, kể cả SUS, AL và CU. Độ rộng joint lỗ bằng 0, đường cắt lỗ khép kín như SS; vị trí điểm vào và thứ tự thử vị trí (mục 5) giữ nguyên. Joint của biên ngoài không đổi. Có cảnh báo \"Khách hàng 824: không tạo joint cho lỗ bên trong\".\n   - Khi bạn chỉnh tay vật liệu hoặc độ dày của một file có trong Excel, khách hàng vẫn lấy từ dòng Excel đó. File không có trong Excel (nhập tay hoàn toàn) coi như không có khách hàng đặc biệt.\n   - Dùng dòng lệnh: thêm mã khách làm tham số cuối, ví dụ `NC_Tool.exe --convert in.dxf out.nc SUS 1.5 824`.\n\n## 3. Thứ tự đường cắt\n\n1. Lỗ trắng (`9016`).\n2. Kẻ dấu (`9017`).\n3. Piercing xuyên màu xanh lá.\n4. Khe cắt (xanh lá).\n5. Các lỗ, theo diện tích tăng dần. Cùng diện tích thì chọn lỗ gần vị trí hiện tại nhất. **Diện tích chênh nhau dưới 6% được coi là cùng diện tích** (từ 14-11-2026, ca 26-067424: lỗ dài cong 52.4 mm² và hai lỗ dài thẳng 49.6 mm² chênh 5.6%, mẫu T cắt lỗ dài cong, là lỗ gần nhất, trước).\n6. Biên ngoài, cắt cuối cùng.\n\nTrong cùng một nhóm, các đối tượng khác nhau được cắt theo thứ tự gần vị trí hiện tại nhất, bắt đầu từ gốc (0, 0).\n\n## 4. Điểm vào và đường cắt từng loại đối tượng\n\n### 4.1 Kẻ dấu (đỏ)\n1. Vòng kín: đục tại đỉnh gần gốc (0, 0) nhất, cắt **ngược** chiều kim đồng hồ, **không có `G41`** (đục ngay đỉnh nên không có đường dẫn vào). Quy tắc này theo ca 26-061939 và áp dụng cho mọi vật liệu, mọi độ dày (đã sửa `Vi_Du_1.nc` cho khớp ngày 21-10-2026).\n2. Đường tròn đỏ: đục tại góc 225° (góc dưới trái), cắt `G02` một vòng ngay sau `M98P9017`, không có dòng `G01G41`. (Mẫu 26-064456T có dòng `G01G41` do nhầm, bạn đã xác nhận đúng là không có.)\n3. Đường hở: đục tại đầu chạm biên ngoài, kéo dài 3 mm **ngược chiều đoạn đầu của đường kegaki** (không theo pháp tuyến của biên; ca 26-062203 chạm cạnh vát, đoạn đầu nằm ngang nên đục tại (−2, 4)). Nếu kegaki vuông góc biên thì hai cách cho cùng kết quả. Đầu nằm trên cung bo góc của biên ngoài (cách cung dưới 0.001 mm) cũng tính là chạm biên (ca 26-063986: kegaki bắt đầu tại (0.268, 1) trên cung R2, đục tại (−2.732, 1)). Nếu không đầu nào chạm biên thì đục tại đầu gần gốc nhất. Dẫn vào bằng `G01` thường, không `G41`.\n4. **Mọi kegaki, gồm đường thẳng, cung, vòng kín và đường tròn (từ 22-10-2026):** sau khi bật tia đánh dấu (`M98P9017`) không dùng bù dao `G41`. Dòng đầu tiên sau `M98P9017` là `G01` hoặc `G02` thường. Đã sửa `Vi_Du_1.nc` (1 khối) và `Vi_Du_2.nc` (3 khối).\n\n### 4.2 Khe cắt (xanh lá)\n1. Đục tại đầu nằm ngoài chi tiết, cắt qua khe tới đầu kia, **không có `G41`** (từ 28-10-2026, theo ca 26-061922: sau `M98P9010` là `G01` thường). Nhiều khe thì chọn khe gần vị trí hiện tại nhất.\n\n### 4.3 Lỗ\n1. **Điểm vào ưu tiên:** phần nhô nhỏ của lỗ, tức nửa tròn hoặc mũi nhọn lồi (tổng góc ≥ 150°), bán kính nhỏ nhất. Điểm vào là đỉnh của phần nhô.\n2. Nhiều phần nhô cùng bán kính: lỗ nằm ngang vào đầu trái. Lỗ nằm đứng: **lỗ không có joint** (rãnh ngắn, mục 5.1) vào đầu **trên** (ca 26-067424: rãnh đứng tâm-tâm 6 mm vào đầu trên, đục tại tâm cung trên); **lỗ có joint** vào đầu **thấp** (Vi_Du_1). Lỗ nằm ngang khi bề rộng ≥ bề cao, tính theo kích thước thật. Thứ tự các phần nhô theo bán kính rồi theo trục như trên, **không** theo hướng so với tâm lỗ (hướng trái, phải, dưới, trên chỉ dùng khi phải đổi vị trí do cách biên dạng khác < 3 mm).\n3. Lỗ hình tam giác (có 3 cạnh thẳng dài) vào giữa cạnh thẳng dài nhất.\n4. **Lỗ không có phần nhô (chữ nhật, chữ nhật bo góc, vuông) xét theo trục trước:** lỗ ngang hoặc vuông (rộng ≥ cao) vào giữa cạnh trái; lỗ đứng (cao > rộng) vào giữa cạnh đáy. Thứ tự trái, phải, đáy, đỉnh ở mục 5 chỉ dùng để chọn vị trí khác khi vị trí theo trục cách biên dạng khác ≤ 3 mm.\n5. **Điểm vào không bao giờ trùng đỉnh hoặc đầu đoạn:** nếu trùng (kể cả lệch dưới 0.001 mm do DXF) thì dời sang giữa cạnh. Không xuất đoạn cung dài 0. Sai số vị trí trái nhất hoặc thấp nhất khi so điểm vào là 0.01 mm.\n6. **Lỗ nghiêng (ca 26-062754, 26-065394):** lỗ toàn cạnh thẳng, không cạnh nào song song Ox hoặc Oy, không có phần nhô nhỏ và không phải tam giác (ví dụ hình chữ nhật xoay). Vào giữa **cạnh ngắn nhất** (sai số 0.01 mm); các cạnh ngắn bằng nhau thì lấy cạnh thấp nhất (trung điểm có Y nhỏ nhất). Đục vào trong lỗ vuông góc với cạnh đó. Trước 03-11-2026 quy tắc là \"cạnh xuất phát từ đỉnh thấp nhất\", trùng với quy tắc này ở ca 26-062754 nhưng sai ở ca 26-065394.\n8. **Điểm đục trong lỗ:** nếu bán kính của phần nhô nhỏ hơn piercing lỗ thì đục ở tâm cung đó. Ngược lại đục cách điểm vào bằng nhỏ hơn giữa piercing lỗ và nửa bề rộng vuông góc với hướng đục. Hướng đục đi vào trong lỗ.\n7. **Lỗ tròn:** điểm vào thử lần lượt bên trái, bên phải, phía dưới, phía trên và lấy vị trí đầu tiên cách biên dạng khác (biên ngoài và lỗ khác) **từ 3 mm trở lên** (từ 14-11-2026 tính cả đúng 3 mm; ca 26-067249: lỗ cách mép đúng 3 mm vẫn vào bên trái). Mọi lỗ tròn đều áp dụng, kể cả lỗ nhỏ không có joint. Nếu cả bốn vị trí đều ≤ 3 mm thì vào bên trái (lỗ có joint thì chọn vị trí xa nhất). Ca 26-063378: lỗ φ6 tâm (5, 11) cách mép trái 2 mm nên vào bên phải tại (8, 11), piercing tại tâm.\n9. Lỗ cắt ngược chiều kim đồng hồ, `G01G41` tới điểm vào. Lỗ tròn cắt `G03`.\n\n### 4.4 Biên ngoài (cắt chiều kim đồng hồ, bù `G41`)\nPiercing ngoài nằm ngoài biên, cách đúng bằng piercing ngoài, dẫn vào vuông góc với biên.\n\n1. **Cạnh trái thẳng đứng (dọc Oy, sát Oy), không tính bo R và vát C:**\n   - Dài ≤ 100 mm: đục giữa cạnh.\n   - Dài > 100 mm: đục cách đầu dưới của cạnh 40 mm.\n   - Có nhiều cạnh thẳng đứng sát Oy: chọn cạnh **thấp nhất** (Y nhỏ nhất), không chọn cạnh dài nhất. Nếu cạnh thấp nhất ngắn hơn 10 mm thì áp dụng mục 4.4.2 (cạnh đáy). Ca 26-063416: cạnh trái bị hai rãnh cắt làm ba đoạn 4.5, 70 và 4.5 mm; đoạn thấp nhất 4.5 mm nên đục ở cạnh đáy dài 160.8 mm, cách đầu trái 40 mm.\n   - Có nhiều cạnh đáy thẳng nằm trên Ox: chọn cạnh **trái nhất** (không chọn cạnh dài nhất), giống cách chọn cạnh trái thấp nhất ở mục 4.4.1. Ca 26-065395: đáy có đoạn 8.0 mm ở góc trái và đoạn 27.5 mm sau rãnh cắt; đục ở đoạn 8.0 mm, tại giữa cạnh (4.503, −3).\n2. **Cạnh trái dưới 10 mm:** đục ở cạnh dưới nằm trên trục Ox, nằm ngoài biên, cách đoạn thẳng đó một khoảng bằng piercing ngoài:\n   - Cạnh dưới ≤ 100 mm: đục giữa cạnh dưới.\n   - Cạnh dưới > 100 mm: đục cách đầu trái 40 mm.\n3. Đường cắt dừng trước điểm vào một đoạn bằng joint ngoài.\n4. **Không tự xoay hình (từ 14-11-2026):** DXF để hướng nào thì giữ nguyên hướng đó, không thử xoay 90°, 180°, 270° để tìm cạnh thẳng đứng như trước. Nếu không có cạnh thẳng đứng sát Oy thì áp dụng quy tắc phôi cong hoặc xiên (mục 7 bên dưới). Phôi vẫn được dời về gốc (0, 0), có cảnh báo khi dời.\n   - **Dung sai:** cạnh được coi là thẳng đứng sát Oy (hoặc nằm ngang sát Ox) khi lệch không quá 0.01 mm. DXF hay có nhiễu cỡ 0.0001 mm làm cạnh hơi nghiêng; trước đây dung sai 0.0001 mm khiến tool xoay nhầm phôi (ca 26-062063). Cảnh báo dời gốc chỉ hiện khi dời trên 0.01 mm. (Dung sai này vẫn dùng để nhận cạnh thẳng đứng, nhưng không còn dẫn đến việc xoay.)\n5. **Phôi tròn:** đục tại góc 225°, cắt một vòng `G02`, dừng trước điểm vào một đoạn joint ngoài.\n6. **Phôi gần tròn:** nếu đoạn trái nhất của biên ngoài là cung lớn (các cung cùng tâm, cùng bán kính quét tổng ≥ 180°) và điểm 225° của cung nằm trên cung, áp dụng quy tắc phôi tròn của mục 4.4.5: đục tại góc 225° của cung, cách ngoài theo hướng tâm, cắt `G02`, dừng trước điểm vào một đoạn joint ngoài. Có cảnh báo.\n7. **Phôi cong hoặc xiên (không xoay ra cạnh thẳng đứng nào, không thuộc mục 6):** lấy cạnh nằm ngay phía dưới đỉnh trái nhất (đoạn đi trước đỉnh đó theo chiều kim đồng hồ, bỏ qua cung bo R ≤ 5). Cạnh dài ≤ 100 mm: vào giữa cạnh. Cạnh dài > 100 mm: vào cách đầu gần đỉnh trái 40 mm, đo theo đường thẳng. Đục ngoài theo pháp tuyến ngoài của cạnh. Riêng cạnh **thẳng** dài hơn 100 mm: vào cách **đỉnh dưới** của cạnh 40 mm (đỉnh là giao của cạnh với cạnh kề phía dưới, bỏ qua cung bo góc R ≤ 5), không tính từ đầu trên. Ca 26-064456: cạnh trái nghiêng dài 199 mm, vào tại (36.1, 38.867), cách đỉnh dưới 40 mm.\n8. **Biên không có cạnh thẳng đứng chạm điểm trái nhất (đường cong, hoặc cạnh trái xiên; ca ViDu_Spline_1, 26-068005, 26-068007):** nếu không có cạnh thẳng đứng nào chạm điểm trái nhất của biên ngoài (điểm đó nằm trên spline, cung hoặc cạnh xiên), đồng thời có cạnh đáy thẳng nằm trên Ox dài từ 10 mm trở lên, thì không xoay phôi và đục ở cạnh đáy theo quy tắc cạnh đáy ở mục 4.4.2: đáy ≤ 100 mm đục giữa cạnh, đáy > 100 mm đục cách đầu trái 40 mm, đục ngoài biên theo piercing ngoài, đường cắt đi sang trái (chiều kim đồng hồ) và dừng trước điểm vào một đoạn joint ngoài. Gốc tọa độ: có spline thì lấy theo bao của các điểm điều khiển spline cùng các đường khác (ở ca ViDu_Spline_1 gốc không đổi); chỉ có cung thì dời theo bao thông thường. Có cảnh báo. Kích thước ở tiêu đề tính cả gốc (0, 0). Quy tắc này đứng trước quy tắc phôi cong ở mục 4.4.7, nhưng không áp dụng khi không có cạnh đáy thẳng trên Ox. Mở rộng cho cung theo yêu cầu ngày 24-10-2026, mở rộng cho cạnh trái xiên ngày 14-11-2026: ca 26-068005 (SS 3.2, đáy 40.229 → vào giữa cạnh đáy tại (80.229, −3) theo mục 4.4.2, vì không còn xoay phôi) và 26-068007 (SS 6, vào tại (33.347, −6)).\n\n### 4.5 Phôi dài hẹp (cạnh ngắn ≤ 100, cạnh dài ≥ 1000)\n1. Bắt buộc có một điểm đánh dấu `LJ` và ít nhất một điểm `J` (TEXT kèm POINT, nằm trên cạnh dài). Thiếu một hoặc cả hai: báo lỗi nêu rõ tên điểm thiếu.\n2. Có thể có nhiều điểm `J`. Xếp `LJ` và các `J` theo chiều kim đồng hồ trên biên ngoài, bắt đầu từ `LJ`. Mỗi cặp điểm liên tiếp là một đường cắt, nên số đường cắt bằng số điểm đánh dấu (1 LJ + n J = n + 1 đường). Đều chạy chiều kim đồng hồ.\n3. Đường bắt đầu tại `LJ`: đục ngoài, dẫn vuông góc vào, cắt quanh biên, dừng cách điểm đánh dấu kế tiếp một đoạn joint ngoài.\n4. Đường bắt đầu tại một `J`: chạy dọc cạnh, dừng cách điểm đánh dấu kế tiếp một đoạn joint ngoài. Đường của `J` cuối cùng dừng cách `LJ` một đoạn joint ngoài.\n5. Mọi POINT trùng vị trí `J` hoặc `LJ` (kể cả nhiều J) không bị hiểu là lỗ trắng.\n\n## 5. Joint lỗ và vị trí joint\n\n1. **Lỗ có joint khi:**\n   - Lỗ tròn Ø ≥ 50.\n   - Lỗ dài (hai nửa tròn và hai cạnh thẳng): tâm đến tâm ≥ 10.\n   - Lỗ dài cong (hai đầu bo tròn cùng bán kính, hai cạnh là cung; ca 26-063771): chiều dài trục ≥ 10, tính bằng trung bình độ dài hai cạnh. Với lỗ dài thẳng chiều dài trục chính là tâm đến tâm.\n   - Lỗ vuông hoặc lỗ hình khác: cạnh lớn nhất ≥ 15.\n2. Độ rộng joint lỗ theo bảng mục 2. Với SS bằng 0 nhưng vẫn áp dụng quy tắc vị trí.\n3. **Thứ tự ưu tiên vị trí joint (cao xuống thấp):**\n   1. Cách các biên dạng xung quanh (biên ngoài và lỗ khác) hơn 3 mm.\n   2. Bên trái.\n   3. Bên phải.\n   4. Phía dưới.\n   5. Phía trên.\n4. Vị trí cách các biên dạng khác 3 mm trở xuống bị loại trước. Nếu mọi vị trí đều gần thì chọn vị trí xa nhất và ghi cảnh báo.\n5. Với lỗ tròn, thử lần lượt trái, phải, dưới, trên.\n6. Với lỗ có phần nhô nhỏ, vẫn ưu tiên phần nhô trước, rồi mới áp dụng thứ tự trái, phải, dưới, trên. Lỗ không có phần nhô thì ưu tiên vị trí theo trục (mục 4.3.4) trước, rồi mới đến trung điểm các cạnh và cung theo thứ tự trái, phải, dưới, trên.\n7. Đường cắt lỗ dừng trước điểm vào một đoạn bằng joint lỗ.\n\n## 6. Dày từ 19 mm: đục piercing cong\n\nÁp dụng cho biên ngoài thẳng, phôi tròn và phôi cong. Vị trí đặt piercing theo mục 4.4, chỉ khác kiểu dẫn vào.\n\n| Nhóm | Dẫn vào | Joint ngoài |\n|---|---|---|\n| SS | Đục cách biên 10 mm. Thẳng 7 mm rồi cung R3 ngược chiều kim đồng hồ, vào tiếp tuyến tại điểm vào. | 3: đường cắt dừng cách điểm vào 3 mm dọc cạnh |\n| SUS | Đục cách biên 10 mm và lệch 10 mm dọc biên. Thẳng 10 mm về điểm chuẩn, thẳng 7 mm vào, cung R3. Điểm vào lệch +3 mm theo chiều cắt so với điểm chuẩn. | 3 |\n| AL | Giống SUS. | 0.01 |\n\n1. **SS dày từ 19:** DXF phải bo hết các góc nhọn (trong và ngoài, kể cả mặt vát). Còn góc nhọn thì báo lỗi kèm tọa độ. SUS và AL không có kiểm tra này.\n2. Piercing lỗ là 10 mm cho cả ba nhóm. Joint lỗ: SS 0, SUS 1, AL 0.\n3. **Đường dẫn vào đã vẽ sẵn trong DXF (từ 07-11-2026, ca ViDu_AL_t19):** DXF có thể đã vẽ sẵn đường dẫn vào piercing cong (hai đoạn thẳng nối với một cung R3) cùng khe hở joint ngay trên biên ngoài. Khi đó biên ngoài là một đường hở, có đúng hai đầu mút, và tool không báo lỗi hở mà cắt đúng theo đường vẽ:\n   - Điểm đục là đầu tự do xa tâm nhất của đường hở (đầu nằm ngoài phôi, ví dụ (−10, 60)). Đường cắt bắt đầu bằng `G01G41` đi theo từng đoạn đã vẽ và kết thúc tại đầu kia (ví dụ (0, 52.995)). Độ rộng joint chính là khe hở đã vẽ (0.005 mm ở ca mẫu), không tra theo bảng mục 2.\n   - Không xoay phôi, không xét cạnh trái. Gốc tọa độ lấy theo phần biên ngoài sau đường dẫn vào, nên đường dẫn có thể nằm ngoài gốc (x âm). Kích thước ở tiêu đề tính cả điểm đục.\n   - Áp dụng cho dày ≥ 19 của mọi nhóm (SS, SUS, AL). Bỏ kiểm tra góc nhọn của SS dày ≥ 19 với đường hở kiểu này. Các lỗ và đường cắt khác xử lý như bình thường.\n\n## 7. Cấu trúc file NC\n\n1. Định dạng: ASCII, xuống dòng CRLF, dòng cuối không có CRLF. Số bỏ 0 thừa, số nguyên vẫn có dấu chấm (`21.`, `0.`). Không có dấu cách giữa các từ lệnh.\n2. Tiêu đề: `(TÊN.DXF / rộng X cao)`. Kích thước tính cả điểm đục ngoài.\n3. Đầu file: `#501=106`, `M66`, `G90`, `G92X0.Y0.`.\n4. Mỗi đường cắt: `G00…G40`, mã cắt, `G01G41…`, các đoạn cắt, `M121`, `M199`. Cuối file: `G01G40`, `M30`.\n5. Cuối file: `CUTTING_LENGTH`, `RAPID_LENGTH` (từ gốc qua các điểm đục, không tính quay về), `TOTAL_LENGTH`, `BEAM_ON` (số lần đục).\n\n## 8. Giao diện và quy trình\n\n1. Kéo thả hoặc chọn file DXF. Chọn nhiều file bằng Shift hoặc Ctrl. File có lỗi hiện dấu X đỏ kèm lý do.\n2. Chọn một file Excel danh sách vật liệu (3 cột: Mã DXF, Vật liệu, Độ dày, thêm cột Khách hàng nếu có; đọc được mẫu CAD依頼書). Excel tự đọc lại khi bạn sửa file.\n3. Bấm **Lưu File .nc** hoặc **Lưu Tất Cả**: lưu file NC, gỡ file đã lưu khỏi danh sách (file DXF trên ổ đĩa giữ nguyên), bỏ chọn file Excel, rồi hiện hộp thoại thành công.\n4. Hai ô Vật Liệu và Độ Dày tự hiện đúng thông số của file đang chọn. Đổi hai ô chỉ áp dụng cho file đang chọn.\n5. Chế độ sáng hoặc tối được nhớ cho lần mở sau.\n\n## 9. Ví dụ đối chiếu\n\nNC của phần mềm khớp từng dòng với các ví dụ sau (trừ dòng tên file). Thư mục `Vi_Du`.\n\n| Ví dụ | Nội dung |\n|---|---|\n| Vi_Du_1, 4 | SS dày 3.2, biên có lỗ (Vi_Du_1 đã sửa: 21-10-2026 kegaki vòng kín ngược chiều kim đồng hồ không G41, 28-10-2026 khe cắt không G41) |\n| Vi_Du_3 | SUS dày 6, phôi dài hẹp có điểm J và LJ |\n| Vi_Du_5 | SS dày 19, đục cong (đã sửa 19-10-2026: đường cắt dừng ở Y47, joint 3) |\n| Vi_Du_6 | SUS dày 19, đục cong |\n| Vi_Du_7 | AL dày 19, đục cong |\n| Vi_Du_8 | Phôi tròn SS dày 6 |\n| Vi_Du_9, 10 | Phôi cong SS dày 6 |\n| Vi_Du_2 | S u_AL_t19) | AL dày 19, DXF đã vẽ sẵn đường dẫn vào piercing cong và khe joint 0.005 mm, cắt đúng theo đường vẽ (mục 6.3) |\n| Vi_Du_24 (26-068005) | SS dày 3.2, phôi cạnh trái xiên, không xoay, đục ở cạnh đáy trên Ox (mục 4.4.8), lỗ tròn φ32 vào bên trái |\n| Vi_Du_25 (26-068007) | SS dày 6, phôi cạnh trái xiên + cung lớn, đục ở cạnh đáy 40 mm từ đầu trái (mục 4.4.8) |\n| Vi_Du_26 (26-067249) | SS dày 1, lỗ tròn cách biên đúng 3 mm vẫn vào bên trái (mục 4.3.7) |\n| Vi_Du_27 (26-067424) | SUS dày 3, rãnh đứng ngắn không joint vào đầu trên (4.3.2); lỗ dài cong cắt trước hai rãnh thẳng vì diện tích chênh < 6% (mục 3) |\n| NC_Tool_Fix: 26-062754 | Thông số CU (6, 0.7), lỗ chữ nhật xoay 45° vào giữa cạnh từ đỉnh thấp nhất (mục 4.3.6) |\n| NC_Tool_Fix: 26-062203 | SS dày 6, kegaki hở chạm cạnh vát, kéo dài theo hướng đường (mục 4.1.3) |\n\n## 10. Chưa hỗ trợ hoặc cần lưu ý\n\n1. Phôi tròn: điểm vào cố định tại góc 225°, chưa có quy tắc đổi hướng khi gần biên khác.\n2. Đồng (CU) không phân biệt độ dày, kể cả từ 19 mm trở lên (không đục cong).\n3. Bo R tự động: phần mềm chỉ kiểm tra góc nhọn với SS dày từ 19, không tự bo.\n4. Lỗ nhỏ hơn ngưỡng ở mục 5 không có joint (theo quy tắc), nhưng vẫn theo quy tắc điểm vào ở mục 4.3.\n## Lịch sử cập nhật\n\n| Ngày | Nội dung |\n|---|---|\n| 18-10-2026 | Lập file tổng hợp từ toàn bộ quy tắc hiện có |\n| 19-10-2026 | Thêm 5 quy tắc từ các ca NC_Tool_Fix: lỗ không có phần nhô xét theo trục trước (4.3.4); điểm vào không trùng đỉnh (4.3.5); nhiều cạnh trái bằng nhau chọn cạnh thấp nhất (4.4.1); phôi gần tròn dùng quy tắc 225° (4.4.6); nhiều điểm J (4.5) |\n| 21-10-2026 | Thêm đồng thau 真鍮 vào nhóm CU (cùng thông số với đồng); trước đó cột vật liệu 真鍮 trong Excel không được nhận ra |\n| 21-10-2026 | Thêm 4 quy tắc từ 3 ca NC_Tool_Fix: dung sai cạnh thẳng đứng 0.01 mm (4.4.4); kegaki hở kéo dài theo hướng đường (4.1.3); kegaki vòng kín ngược chiều kim đồng hồ, không G41 (4.1.1); SS dày ≥ 19 joint ngoài 3 (mục 2, 6), sửa Vi_Du_5 và Vi_Du_1 ( const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inline = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');

// ---------- phan tich markdown ----------
function parse(md){
  const L = md.replace(/\r/g,'').split('\n'), doc = {title:'', updated:'', sections:[]};
  let sec = null, i = 0;
  const push = b => sec && sec.blocks.push(b);
  while (i < L.length){
    const ln = L[i];
    if (/^# /.test(ln)) { doc.title = ln.slice(2).trim(); i++; continue; }
    if (/^Cập nhật lần cuối/.test(ln)) { doc.updated = ln.trim(); i++; continue; }
    if (/^## /.test(ln)) { const t = ln.slice(3).trim(), m = t.match(/^(\d+)\.\s*(.*)$/); sec = {num: m ? m[1] : '', title: m ? m[2] : t, blocks: []}; doc.sections.push(sec); i++; continue; }
    if (/^### /.test(ln)) { push({t:'h3', text: ln.slice(4).trim()}); i++; continue; }
    if (/^\|/.test(ln)) {
      const rows = []; while (i < L.length && /^\|/.test(L[i])) { rows.push(L[i].trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim())); i++; }
      push({t:'table', head: rows[0], rows: rows.slice(2)}); continue;
    }
    if (/^\s*(\d+\.|-)\s+/.test(ln)) {
      const ordered = /^\s*\d+\./.test(ln), items = [];
      while (i < L.length && /^\s*(\d+\.|-)\s+/.test(L[i])) {
        const m = L[i].match(/^(\s*)(\d+\.|-)\s+(.*)$/);
        if (m[1].length >= 2 && items.length) { const par = items[items.length-1]; (par.sub = par.sub || {ordered: /\d/.test(m[2]), items: []}).items.push(m[3]); }
        else items.push({text: m[3]});
        i++;
      }
      push({t:'list', ordered, items}); continue;
    }
    if (ln.trim()) push({t:'p', text: ln.trim()});
    i++;
  }
  return doc;
}

// ---------- hien thi ----------
const dotOf = c => { const x = c.toLowerCase(); return x.includes('xanh lá') ? 'var(--ok)' : x.startsWith('đỏ') || x.includes('(aci 1)') ? 'var(--err)' : x.includes('by layer') ? 'var(--mut)' : null; };
function cell(c, col, head){
  let h = inline(c);
  if (/^M98P/.test(c)) return '<span class="chip acc">' + h + '</span>';
  const d = col === 1 && /Màu/.test(head) ? dotOf(c) : null;
  if (d) h = '<span class="dot" style="background:' + d + '"></span>' + h;
  if (/^Vi_Du/.test(c)) h = '<b>' + h + '</b>';
  if (/17 trong 22/.test(c)) h = h.replace('17 trong 22','<span class="chip warn">17/22</span>');
  return h;
}
function table(b){
  return '<div class="tw"><table><thead><tr>' + b.head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>' +
    b.rows.map(r => '<tr>' + r.map((c,k) => '<td>' + cell(c,k,b.head[k]||'') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function list(b){
  const tag = b.ordered ? 'ol' : 'ul';
  return '<' + tag + '>' + b.items.map(it => '<li>' + inline(it.text) + (it.sub ? '<' + (it.sub.ordered?'ol':'ul') + '>' + it.sub.items.map(s => '<li>' + inline(s) + '</li>').join('') + '</' + (it.sub.ordered?'ol':'ul') + '>' : '') + '</li>').join('') + '</' + tag + '>';
}
function steps(items){
  return '<div class="steps">' + items.map((it,k) => (k ? '<div class="step arrow">→</div>' : '') + '<div class="step"><i>' + (k+1) + '</i><span>' + inline((typeof it === 'string' ? it : it.text).replace(/[.]\s*$/, '')) + '</span></div>').join('') + '</div>';
}
function render(doc){
  document.getElementById('ttl').textContent = doc.title || 'Quy tắc NC Tool';
  document.getElementById('upd').textContent = doc.updated;
  document.title = (doc.title || 'Quy tắc NC Tool') + ' - Dashboard';
  const nav = document.getElementById('nav'), cards = document.getElementById('cards');
  nav.innerHTML = doc.sections.map(s => '<a href="#s' + s.num + '"><b>' + (s.num || '•') + '</b><span>' + esc(s.title) + '</span></a>').join('');
  cards.innerHTML = doc.sections.map((s,k) => {
    let body = s.blocks.map(b => {
      if (b.t === 'h3') return '<h3>' + inline(b.text) + '</h3>';
      if (b.t === 'p') return '<p>' + inline(b.text) + '</p>';
      if (b.t === 'table') return table(b);
      if (b.t === 'list') return list(b);
      return '';
    }).join('');
    // thu tu duong cat: hien thanh cac buoc
    if (/Thứ tự đường cắt/.test(s.title)) { const ol = s.blocks.find(b => b.t === 'list' && b.ordered); if (ol) body = steps(ol.items) + s.blocks.filter(b => b !== ol).map(b => b.t === 'p' ? '<p>' + inline(b.text) + '</p>' : '').join(''); }
    // uu tien vi tri joint: hien thanh cac buoc
    if (/Joint lỗ và vị trí joint/.test(s.title)) {
      let pr = null; s.blocks.forEach(b => { if (b.t === 'list') b.items.forEach(it => { if (it.sub && /Thứ tự ưu tiên/.test(it.text)) pr = it; }); });
      if (pr) body = '<h3>Thứ tự ưu tiên chọn vị trí joint</h3>' + steps(pr.sub.items) + '<h3>Quy tắc chi tiết</h3>' + body;
    }
    return '<details class="card" id="s' + s.num + '" ' + (k < 3 ? 'open' : '') + '><summary><span class="num">' + (s.num || '•') + '</span>' + esc(s.title) + '<span class="chev">▶</span></summary><div class="body" data-raw="1">' + body + '</div></details>';
  }).join('');
  // KPI
  const t2 = doc.sections.find(s => /Vật liệu, độ dày/.test(s.title)), tb = t2 && t2.blocks.find(b => b.t === 'table');
  const ex = doc.sections.find(s => /Ví dụ đối chiếu/.test(s.title)), eb = ex && ex.blocks.find(b => b.t === 'table');
  const groups = tb ? new Set(tb.rows.map(r => r[0])).size : 0;
  const rules = doc.sections.reduce((n,s) => n + s.blocks.filter(b => b.t === 'list').reduce((m,b) => m + b.items.length, 0), 0);
  document.getElementById('kpis').innerHTML = [['Mục quy tắc', doc.sections.filter(s => s.num).length], ['Nhóm vật liệu', groups], ['Quy tắc chi tiết', rules], ['Ví dụ đối chiếu', eb ? eb.rows.length : 0]].map(k => '<div class="kpi"><small>' + k[0] + '</small><b>' + k[1] + '</b></div>').join('');
  if (tb) lookup(tb);
}

// ---------- tra cuu thong so (doc truc tiep tu bang muc 2) ----------
function inRange(txt, t){
  if (/mọi độ dày/i.test(txt)) return true;
  return txt.split(/,\s*(?:và\s*)?/).some(p => {
    let m;
    if ((m = p.match(/≤\s*([\d.]+)/))) return t <= +m[1] + 1e-9;
    if ((m = p.match(/≥\s*([\d.]+)/))) return t >= +m[1] - 1e-9;
    if ((m = p.match(/([\d.]+)\s*đến\s*([\d.]+)/))) return t > +m[1] + 1e-9 && t <= +m[2] + 1e-9;
    if ((m = p.match(/trên\s*([\d.]+)\s*dưới\s*([\d.]+)/))) return t > +m[1] + 1e-9 && t < +m[2] - 1e-9;
    return false;
  });
}
function lookup(tb){
  const sec = document.getElementById('lookup'); sec.hidden = false;
  const gs = [...new Set(tb.rows.map(r => r[0]))], sel = document.getElementById('lg'), inp = document.getElementById('lt');
  sel.innerHTML = gs.map(g => '<option>' + esc(g) + '</option>').join('');
  const go = () => {
    const t = parseFloat(inp.value), g = sel.value, res = document.getElementById('lres'), note = document.getElementById('lnote');
    const row = tb.rows.find(r => r[0] === g && inRange(r[1], t));
    if (!row || !(t > 0)) { res.innerHTML = '<div><small>Kết quả</small><b>Chưa có quy tắc</b></div>'; note.textContent = ''; return; }
    res.innerHTML = tb.head.slice(2).map((h,k) => '<div><small>' + esc(h) + '</small><b>' + inline(row[k+2]) + '</b></div>').join('');
    note.textContent = (g === 'SS' && t >= 19) ? 'Thép dày từ 19 mm: DXF phải bo hết góc nhọn (R3), đục piercing cong.' : ((g === 'SUS' || g === 'AL') && t >= 19 ? 'Dày từ 19 mm: đục piercing cong (xem mục 6).' : '');
  };
  sel.onchange = inp.oninput = go; go();
}

// ---------- tim kiem ----------
function search(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('#cards details.card').forEach(c => {
    const hit = !q || c.textContent.toLowerCase().includes(q);
    c.classList.toggle('hide', !hit);
    if (q && hit) c.open = true;
    c.querySelectorAll('mark').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
    if (q && hit) {
      const w = document.createTreeWalker(c.querySelector('.body'), NodeFilter.SHOW_TEXT), nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
      nodes.forEach(n => { const i = n.textContent.toLowerCase().indexOf(q); if (i >= 0) { const r = document.createRange(); r.setStart(n,i); r.setEnd(n,i+q.length); const m = document.createElement('mark'); r.surroundContents(m); } });
    }
  });
}
document.getElementById('q').addEventListener('input', e => search(e.target.value));
render(parse(MD));
// nav dang chon
const links = [...document.querySelectorAll('nav a')];
addEventListener('scroll', () => { let cur = null; document.querySelectorAll('#cards details.card').forEach(c => { if (c.getBoundingClientRect().top < 120) cur = c.id; }); links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur)); });
</script>
