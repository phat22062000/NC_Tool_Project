<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quy Tắc NC Tool - Dashboard</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1a2233;--mut:#5d6b82;--line:#dde2ea;--acc:#1d5fd1;--accbg:#e6f0fd;--ok:#16803c;--okbg:#e6f4ea;--warn:#a05a00;--warnbg:#fdf0da;--err:#b42318;--errbg:#fdeceb;--code:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e7eaf0;--mut:#9aa6ba;--line:#2e3644;--acc:#6aa3ff;--accbg:#1b2c48;--ok:#4ade80;--okbg:#17321f;--warn:#f5b44a;--warnbg:#3a2a10;--err:#f87171;--errbg:#3b1b1b;--code:#232a36}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:600}
header .upd{color:var(--mut);font-size:13px}
header input{margin-left:auto;min-width:240px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;max-width:1280px;margin:0 auto;padding:22px 24px 60px}
nav{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 96px);overflow:auto}
nav a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
nav a:hover,nav a.on{background:var(--accbg);color:var(--acc)}
nav a b{width:24px;height:24px;border-radius:7px;background:var(--accbg);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.kpi small{display:block;color:var(--mut);font-size:12.5px}.kpi b{font-size:26px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.card>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 18px;font-size:17px;font-weight:600}
.card>summary::-webkit-details-marker{display:none}
.card>summary .num{width:30px;height:30px;border-radius:9px;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.card>summary .chev{margin-left:auto;color:var(--mut);transition:transform .15s}
.card[open]>summary .chev{transform:rotate(90deg)}
.body{padding:2px 18px 18px;border-top:1px solid var(--line)}
.body h3{font-size:15px;margin:18px 0 6px;color:var(--acc)}
.body p{margin:10px 0}
.body ol,.body ul{margin:8px 0;padding-left:22px}.body li{margin:5px 0}
.body li>ul,.body li>ol{margin:4px 0}
code{background:var(--code);padding:1px 6px;border-radius:5px;font:13px Consolas,monospace}
.tw{overflow:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--code);text-align:left;font-weight:600;white-space:nowrap}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accbg)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:600}
.chip.acc{background:var(--accbg);color:var(--acc)}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.err{background:var(--errbg);color:var(--err)}
.steps{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:12px 0}
.step{display:flex;gap:8px;align-items:center;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.step.arrow{background:none;border:0;padding:0;color:var(--mut);align-self:center}
.lookup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.lookup h2{font-size:17px;margin:0 0 10px}
.lookup .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.lookup label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);gap:4px}
.lookup select,.lookup input{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:150px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.res div{background:var(--code);border-radius:10px;padding:10px 14px}.res small{display:block;color:var(--mut);font-size:12.5px}.res b{font-size:20px;font-weight:600}
.note{margin-top:10px;font-size:13.5px;color:var(--warn)}
mark{background:#ffe27a;color:#000;border-radius:3px}
.hide{display:none!important}
@media(max-width:860px){.wrap{grid-template-columns:1fr}nav{display:none}}
</style>
</head>
<body>
<header><h1 id="ttl">Quy tắc NC Tool</h1><span class="upd" id="upd"></span><input id="q" type="search" placeholder="Tìm quy tắc (ví dụ: joint, piercing, SUS…)"></header>
<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <div class="kpis" id="kpis"></div>
    <section class="lookup" id="lookup" hidden>
      <h2>Tra cứu thông số theo vật liệu và độ dày</h2>
      <div class="row">
        <label>Nhóm vật liệu<select id="lg"></select></label>
        <label>Độ dày (mm)<input id="lt" type="number" step="0.1" min="0.1" value="3.2"></label>
      </div>
      <div class="res" id="lres"></div><div class="note" id="lnote"></div>
    </section>
    <div id="cards"></div>
  </main>
</div>
<script>
const MD = __MD__;
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inline = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');

// ---------- phan tich markdown ----------
function parse(md){
  const L = md.replace(/\r/g,'').split('\n'), doc = {title:'', updated:'', sections:[]};
  let sec = null, i = 0;
  const push = b => sec && sec.blocks.push(b);
  while (i < L.length){
    const ln = L[i];
    if (/^# /.test(ln)) { doc.title = ln.slice(2).trim(); i++; continue; }
    if (/^Cập nhật lần cuối/.test(ln)) { doc.updated = ln.trim(); i++; continue; }
    if (/^## /.test(ln)) { const t = ln.slice(3).trim(), m = t.match(/^(\d+)\.\s*(.*)$/); sec = {num: m ? m[1] : '', title: m ? m[2] : t, blocks: []}; doc.sections.push(sec); i++; continue; }
    if (/^### /.test(ln)) { push({t:'h3', text: ln.slice(4).trim()}); i++; continue; }
    if (/^\|/.test(ln)) {
      const rows = []; while (i < L.length && /^\|/.test(L[i])) { rows.push(L[i].trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim())); i++; }
      push({t:'table', head: rows[0], rows: rows.slice(2)}); continue;
    }
    if (/^\s*(\d+\.|-)\s+/.test(ln)) {
      const ordered = /^\s*\d+\./.test(ln), items = [];
      while (i < L.length && /^\s*(\d+\.|-)\s+/.test(L[i])) {
        const m = L[i].match(/^(\s*)(\d+\.|-)\s+(.*)$/);
        if (m[1].length >= 2 && items.length) { const par = items[items.length-1]; (par.sub = par.sub || {ordered: /\d/.test(m[2]), items: []}).items.push(m[3]); }
        else items.push({text: m[3]});
        i++;
      }
      push({t:'list', ordered, items}); continue;
    }
    if (ln.trim()) push({t:'p', text: ln.trim()});
    i++;
  }
  return doc;
}

// ---------- hien thi ----------
const dotOf = c => { const x = c.toLowerCase(); return x.includes('xanh lá') ? 'var(--ok)' : x.startsWith('đỏ') || x.includes('(aci 1)') ? 'var(--err)' : x.includes('by layer') ? 'var(--mut)' : null; };
function cell(c, col, head){
  let h = inline(c);
  if (/^M98P/.test(c)) return '<span class="chip acc">' + h + '</span>';
  const d = col === 1 && /Màu/.test(head) ? dotOf(c) : null;
  if (d) h = '<span class="dot" style="background:' + d + '"></span>' + h;
  if (/^Vi_Du/.test(c)) h = '<b>' + h + '</b>';
  if (/17 trong 22/.test(c)) h = h.replace('17 trong 22','<span class="chip warn">17/22</span>');
  return h;
}
function table(b){
  return '<div class="tw"><table><thead><tr>' + b.head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>' +
    b.rows.map(r => '<tr>' + r.map((c,k) => '<td>' + cell(c,k,b.head[k]||'') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
}
function list(b){
  const tag = b.ordered ? 'ol' : 'ul';
  return '<' + tag + '>' + b.items.map(it => '<li>' + inline(it.text) + (it.sub ? '<' + (it.sub.ordered?'ol':'ul') + '>' + it.sub.items.map(s => '<li>' + inline(s) + '</li>').join('') + '</' + (it.sub.ordered?'ol':'ul') + '>' : '') + '</li>').join('') + '</' + tag + '>';
}
function steps(items){
  return '<div class="steps">' + items.map((it,k) => (k ? '<div class="step arrow">→</div>' : '') + '<div class="step"><i>' + (k+1) + '</i><span>' + inline((typeof it === 'string' ? it : it.text).replace(/[.]\s*$/, '')) + '</span></div>').join('') + '</div>';
}
function render(doc){
  document.getElementById('ttl').textContent = doc.title || 'Quy tắc NC Tool';
  document.getElementById('upd').textContent = doc.updated;
  document.title = (doc.title || 'Quy tắc NC Tool') + ' - Dashboard';
  const nav = document.getElementById('nav'), cards = document.getElementById('cards');
  nav.innerHTML = doc.sections.map(s => '<a href="#s' + s.num + '"><b>' + (s.num || '•') + '</b><span>' + esc(s.title) + '</span></a>').join('');
  cards.innerHTML = doc.sections.map((s,k) => {
    let body = s.blocks.map(b => {
      if (b.t === 'h3') return '<h3>' + inline(b.text) + '</h3>';
      if (b.t === 'p') return '<p>' + inline(b.text) + '</p>';
      if (b.t === 'table') return table(b);
      if (b.t === 'list') return list(b);
      return '';
    }).join('');
    // thu tu duong cat: hien thanh cac buoc
    if (/Thứ tự đường cắt/.test(s.title)) { const ol = s.blocks.find(b => b.t === 'list' && b.ordered); if (ol) body = steps(ol.items) + s.blocks.filter(b => b !== ol).map(b => b.t === 'p' ? '<p>' + inline(b.text) + '</p>' : '').join(''); }
    // uu tien vi tri joint: hien thanh cac buoc
    if (/Joint lỗ và vị trí joint/.test(s.title)) {
      let pr = null; s.blocks.forEach(b => { if (b.t === 'list') b.items.forEach(it => { if (it.sub && /Thứ tự ưu tiên/.test(it.text)) pr = it; }); });
      if (pr) body = '<h3>Thứ tự ưu tiên chọn vị trí joint</h3>' + steps(pr.sub.items) + '<h3>Quy tắc chi tiết</h3>' + body;
    }
    return '<details class="card" id="s' + s.num + '" ' + (k < 3 ? 'open' : '') + '><summary><span class="num">' + (s.num || '•') + '</span>' + esc(s.title) + '<span class="chev">▶</span></summary><div class="body" data-raw="1">' + body + '</div></details>';
  }).join('');
  // KPI
  const t2 = doc.sections.find(s => /Vật liệu, độ dày/.test(s.title)), tb = t2 && t2.blocks.find(b => b.t === 'table');
  const ex = doc.sections.find(s => /Ví dụ đối chiếu/.test(s.title)), eb = ex && ex.blocks.find(b => b.t === 'table');
  const groups = tb ? new Set(tb.rows.map(r => r[0])).size : 0;
  const rules = doc.sections.reduce((n,s) => n + s.blocks.filter(b => b.t === 'list').reduce((m,b) => m + b.items.length, 0), 0);
  document.getElementById('kpis').innerHTML = [['Mục quy tắc', doc.sections.filter(s => s.num).length], ['Nhóm vật liệu', groups], ['Quy tắc chi tiết', rules], ['Ví dụ đối chiếu', eb ? eb.rows.length : 0]].map(k => '<div class="kpi"><small>' + k[0] + '</small><b>' + k[1] + '</b></div>').join('');
  if (tb) lookup(tb);
}

// ---------- tra cuu thong so (doc truc tiep tu bang muc 2) ----------
function inRange(txt, t){
  if (/mọi độ dày/i.test(txt)) return true;
  return txt.split(/,\s*(?:và\s*)?/).some(p => {
    let m;
    if ((m = p.match(/≤\s*([\d.]+)/))) return t <= +m[1] + 1e-9;
    if ((m = p.match(/≥\s*([\d.]+)/))) return t >= +m[1] - 1e-9;
    if ((m = p.match(/([\d.]+)\s*đến\s*([\d.]+)/))) return t > +m[1] + 1e-9 && t <= +m[2] + 1e-9;
    if ((m = p.match(/trên\s*([\d.]+)\s*dưới\s*([\d.]+)/))) return t > +m[1] + 1e-9 && t < +m[2] - 1e-9;
    return false;
  });
}
function lookup(tb){
  const sec = document.getElementById('lookup'); sec.hidden = false;
  const gs = [...new Set(tb.rows.map(r => r[0]))], sel = document.getElementById('lg'), inp = document.getElementById('lt');
  sel.innerHTML = gs.map(g => '<option>' + esc(g) + '</option>').join('');
  const go = () => {
    const t = parseFloat(inp.value), g = sel.value, res = document.getElementById('lres'), note = document.getElementById('lnote');
    const row = tb.rows.find(r => r[0] === g && inRange(r[1], t));
    if (!row || !(t > 0)) { res.innerHTML = '<div><small>Kết quả</small><b>Chưa có quy tắc</b></div>'; note.textContent = ''; return; }
    res.innerHTML = tb.head.slice(2).map((h,k) => '<div><small>' + esc(h) + '</small><b>' + inline(row[k+2]) + '</b></div>').join('');
    note.textContent = (g === 'SS' && t >= 19) ? 'Thép dày từ 19 mm: DXF phải bo hết góc nhọn (R3), đục piercing cong.' : ((g === 'SUS' || g === 'AL') && t >= 19 ? 'Dày từ 19 mm: đục piercing cong (xem mục 6).' : '');
  };
  sel.onchange = inp.oninput = go; go();
}

// ---------- tim kiem ----------
function search(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('#cards details.card').forEach(c => {
    const hit = !q || c.textContent.toLowerCase().includes(q);
    c.classList.toggle('hide', !hit);
    if (q && hit) c.open = true;
    c.querySelectorAll('mark').forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
    if (q && hit) {
      const w = document.createTreeWalker(c.querySelector('.body'), NodeFilter.SHOW_TEXT), nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
      nodes.forEach(n => { const i = n.textContent.toLowerCase().indexOf(q); if (i >= 0) { const r = document.createRange(); r.setStart(n,i); r.setEnd(n,i+q.length); const m = document.createElement('mark'); r.surroundContents(m); } });
    }
  });
}
document.getElementById('q').addEventListener('input', e => search(e.target.value));
render(parse(MD));
// nav dang chon
const links = [...document.querySelectorAll('nav a')];
addEventListener('scroll', () => { let cur = null; document.querySelectorAll('#cards details.card').forEach(c => { if (c.getBoundingClientRect().top < 120) cur = c.id; }); links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur)); });
</script>
</body>
</html>
